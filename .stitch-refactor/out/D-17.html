<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>DSH 设置 — 备份与迁移 D-17 复制档案弹窗</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
    
    * {
      box-sizing: border-box;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="m-0 p-0 w-full h-full bg-[#EBEEF2] flex items-center justify-center min-h-screen">

  <!-- 插件内容区画布 564x720 竖版容器 -->
  <div class="relative w-[564px] h-[720px] bg-[#EBEEF2] rounded-[12px] border border-[rgba(0,0,0,0.1)] overflow-hidden flex flex-col shadow-none select-none">
    
    <!-- 1. 顶部导航条 44px (灰底外壳 #EBEEF2) -->
    <header class="h-[44px] w-full px-[16px] bg-[#EBEEF2] border-b border-[rgba(0,0,0,0.1)] flex items-center justify-between shrink-0">
      <!-- 左侧页签 -->
      <nav class="flex items-center space-x-[16px] text-[12px] font-medium text-[#61666B]">
        <span class="hover:text-[#0F1115] cursor-default">首页</span>
        <span class="hover:text-[#0F1115] cursor-default">产物库</span>
        <span class="hover:text-[#0F1115] cursor-default">同步</span>
        <!-- 环境页签激活 -->
        <span class="px-[8px] py-[3px] bg-[#EBEEF2] border border-[#979DA6] rounded-[8px] text-[#0F1115] font-semibold cursor-default">环境</span>
      </nav>

      <!-- 右端 4 个 14px 线性图标按钮 -->
      <div class="flex items-center space-x-[12px] text-[#61666B]">
        <!-- ⌘K 图标 -->
        <svg class="w-[14px] h-[14px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3H6a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3 3 3 0 0 0-3 3 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/>
        </svg>
        <!-- 活动折线图标 -->
        <svg class="w-[14px] h-[14px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <!-- 历史时钟图标 -->
        <svg class="w-[14px] h-[14px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 14 14"/>
        </svg>
        <!-- 关于信息图标 -->
        <svg class="w-[14px] h-[14px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
      </div>
    </header>

    <!-- 2. 中间内容区（背景残影：环境页档案列表） -->
    <main class="flex-1 w-full p-[16px] overflow-hidden relative flex flex-col space-y-[12px] opacity-40 blur-[0.6px] pointer-events-none">
      
      <!-- 顶部子切换段 (档案 / 维护与诊断) -->
      <div class="flex items-center justify-between">
        <div class="text-[13px] font-semibold text-[#0F1115]">环境</div>
        <div class="flex items-center bg-[#EBEEF2] border border-[#0000001A] rounded-[8px] p-[2px]">
          <span class="px-[10px] py-[2px] bg-[#FFFFFF] rounded-[6px] text-[11px] font-medium text-[#0F1115]">档案</span>
          <span class="px-[10px] py-[2px] text-[11px] font-medium text-[#61666B]">维护与诊断</span>
        </div>
      </div>

      <!-- 档案概览及列表卡 -->
      <div class="border border-[#0000001A] rounded-[12px] bg-[#FFFFFF] p-[12px] flex flex-col space-y-[10px]">
        <div class="flex items-center justify-between text-[11px] text-[#61666B]">
          <span>已配置 3 个档案</span>
          <span class="text-[#0F1115] font-medium">+ 新建档案</span>
        </div>

        <div class="flex flex-col space-y-[8px] pt-[4px]">
          <!-- default 档案行 -->
          <div class="flex items-center justify-between p-[8px] rounded-[8px] border border-[#0000001A] bg-[#FFFFFF]">
            <div class="flex flex-col">
              <div class="flex items-center space-x-[6px]">
                <span class="text-[12.5px] font-medium text-[#0F1115]">default</span>
                <span class="text-[11px] px-[6px] py-[1px] bg-[#EBEEF2] rounded-[4px] text-[#61666B]">系统默认</span>
              </div>
              <span class="text-[11px] text-[#81858C] font-mono">~/.dsh/profiles/default</span>
            </div>
          </div>

          <!-- 背景关键残影：高亮选中的 work 行 -->
          <div class="flex items-center justify-between p-[8px] rounded-[8px] border border-[#4176E6] bg-[color-mix(in srgb, #4176E6 8%, #FFFFFF)]">
            <div class="flex flex-col">
              <div class="flex items-center space-x-[6px]">
                <span class="text-[12.5px] font-semibold text-[#0F1115]">work</span>
                <span class="text-[11px] px-[6px] py-[1px] bg-[#22C55E1A] text-[#22C55E] rounded-[4px]">当前使用</span>
              </div>
              <span class="text-[11px] text-[#61666B] font-mono">~/.dsh/profiles/work · 8 个 bundle</span>
            </div>
            <!-- 三个图标按钮：复制(高亮)、重命名、删除 -->
            <div class="flex items-center space-x-[8px] text-[#4176E6]">
              <!-- 复制图标 -->
              <svg class="w-[14px] h-[14px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              <!-- 重命名铅笔图标 -->
              <svg class="w-[14px] h-[14px] text-[#81858C]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
              </svg>
              <!-- 删除垃圾桶图标 -->
              <svg class="w-[14px] h-[14px] text-[#81858C]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
            </div>
          </div>

          <!-- backup-2026-11 档案行 -->
          <div class="flex items-center justify-between p-[8px] rounded-[8px] border border-[#0000001A] bg-[#FFFFFF]">
            <div class="flex flex-col">
              <span class="text-[12.5px] font-medium text-[#0F1115]">backup-2026-11</span>
              <span class="text-[11px] text-[#81858C] font-mono">~/.dsh/profiles/backup-2026-11</span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- 3. 底部状态栏 28px (灰底外壳 #EBEEF2) -->
    <footer class="h-[28px] w-full px-[16px] bg-[#EBEEF2] border-t border-[rgba(0,0,0,0.1)] flex items-center justify-between text-[11px] text-[#61666B] shrink-0" style="width:calc(100% - 16px);margin:0 8px 8px;border:1px solid #0000001A;border-radius:8px;box-sizing:border-box">
      <div class="flex items-center space-x-[6px]">
        <span class="w-[6px] h-[6px] rounded-full bg-[#22C55E]"></span>
        <span>就绪</span>
      </div>
      <div class="font-mono text-[#61666B] tabular-nums">
        v0.8.0 · DSH 2.4
      </div>
    </footer>

    <!-- 全局压暗遮罩 (覆盖整块 564x720) -->
    <div class="absolute inset-0 bg-[rgba(0,0,0,0.24)] z-10 pointer-events-none"></div>

    <!-- 4. 居中模态弹窗 D-17「复制档案」 (宽 519px, 纯白 #FFFFFF, 圆角 16px, 1px 细边框, 无阴影) -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[519px] bg-[#FFFFFF] rounded-[16px] border border-[rgba(0,0,0,0.1)] z-20 flex flex-col overflow-hidden">
      
      <!-- 标题行：padding 16px 16px 0, 13px 500 #0F1115, 无 ✕, 无 ⓘ -->
      <div class="pt-[16px] px-[16px] pb-0 flex items-center justify-between">
        <h2 class="text-[13px] font-[500] text-[#0F1115] leading-[1.25] m-0">复制档案</h2>
      </div>

      <!-- 正文区：padding 8px 16px 12px -->
      <div class="pt-[8px] px-[16px] pb-[12px] flex flex-col">
        <!-- 正文第一行：12.5px #61666B -->
        <p class="text-[12.5px] leading-[1.5] text-[#61666B] m-0 mb-[8px]">
          把档案「work」复制成一份新档案：
        </p>

        <!-- 输入框：高 30px、圆角 8px、1px #0000001A 描边、白底，值「work-copy」，12.5px #0F1115，左侧内边距 10px -->
        <div class="w-full">
          <input 
            type="text" 
            value="work-copy" 
            aria-label="副本档案名"
            class="w-full h-[30px] px-[10px] bg-[#FFFFFF] border border-[rgba(0,0,0,0.1)] rounded-[8px] text-[12.5px] text-[#0F1115] font-normal outline-none focus:border-[#4176E6] transition-colors"
          />
        </div>

        <!-- 复选框行（与输入框间距 10px）：16px 勾选框 + 文案「同时复制 node_modules（副本立刻可用）」12.5px #0F1115 -->
        <div class="mt-[10px] flex items-center space-x-[8px] cursor-default">
          <!-- 16px 勾选框：已勾 黑 #0F1115 实心 + 白色对勾 + 圆角 4px -->
          <div class="w-[16px] h-[16px] rounded-[4px] bg-[#0F1115] flex items-center justify-center shrink-0">
            <svg class="w-[11px] h-[11px] text-[#FFFFFF]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <span class="text-[12.5px] leading-[1.5] text-[#0F1115] font-normal select-none">
            同时复制 node_modules（副本立刻可用）
          </span>
        </div>

        <!-- 说明行（复选框下方 4px、左缩进 24px 对齐文字）：11px #81858C -->
        <div class="mt-[4px] ml-[24px]">
          <span class="text-[11px] leading-[1.5] text-[#81858C]">
            同体积 · 约 30 秒 · 不勾选则副本启动前需装依赖
          </span>
        </div>
      </div>

      <!-- 底栏：顶部 0.5px #0000001A，padding 10px 16px 14px，右对齐两颗按钮 -->
      <div class="px-[16px] pt-[10px] pb-[14px] border-t border-[rgba(0,0,0,0.1)] flex items-center justify-end space-x-[8px] bg-[#FFFFFF]">
        <!-- 左边深色主按钮「复制」：#0F1115 填充、白字、高 30px、圆角 8px -->
        <button class="h-[30px] px-[16px] bg-[#0F1115] hover:bg-[#43454A] text-[#FFFFFF] text-[12.5px] font-medium rounded-[8px] flex items-center justify-center transition-colors">
          复制
        </button>
        <!-- 右边 ghost 按钮「取消」：白底 1px #0000001A 描边、次色/主色文字 -->
        <button class="h-[30px] px-[14px] bg-[#FFFFFF] hover:bg-[#EBEEF2] border border-[rgba(0,0,0,0.1)] text-[#0F1115] text-[12.5px] font-medium rounded-[8px] flex items-center justify-center transition-colors">
          取消
        </button>
      </div>

    </div>

  </div>

</body>
</html>
