<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DSH 设置 — 备份与迁移 D-08 同步通道配置弹窗</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .font-mono {
    font-family: 'JetBrains Mono', monospace;
  }
</style>
</head>
<body class="bg-[#EBEEF2] m-0 p-0 flex items-center justify-center min-h-screen select-none text-[#0F1115]">

  <!-- 外层 564x720 插件容器 -->
  <div class="relative w-[564px] h-[720px] bg-white rounded-xl overflow-hidden flex flex-col border border-black/10 shadow-sm">
    
    <!-- ============================================== -->
    <!-- 下层：被遮罩压暗的「同步」页底板 (灰阶 & 弱化) -->
    <!-- ============================================== -->
    <div class="absolute inset-0 flex flex-col bg-[#FFFFFF] z-0 pointer-events-none">
      <!-- 顶部 32px 页签栏 -->
      <div class="h-[32px] px-3 border-b border-black/10 flex items-center justify-between bg-[#F8F9FA]">
        <div class="flex items-center space-x-1 h-full">
          <span class="px-2 py-1 text-[12px] text-[#61666B]">首页</span>
          <span class="px-2 py-1 text-[12px] text-[#61666B]">产物库</span>
          <span class="px-2.5 py-1 text-[12px] font-medium text-[#0F1115] bg-[#EBEEF2] rounded-md border border-[#979DA6]/40">同步</span>
          <span class="px-2 py-1 text-[12px] text-[#61666B]">环境</span>
        </div>
        <div class="flex items-center space-x-2 text-[#81858C]">
          <!-- ⌘K -->
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9h6v6H9z"/></svg>
          <!-- 活动 -->
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          <!-- 历史 -->
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <!-- 关于 -->
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        </div>
      </div>

      <!-- 同步页背景内容简要轮廓 -->
      <div class="flex-1 p-3 space-y-2.5 bg-[#FFFFFF]">
        <div class="border border-black/10 rounded-lg p-3 bg-white">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center space-x-1.5">
              <span class="text-[12.5px] font-medium text-[#0F1115]">Git 私有仓库</span>
              <span class="text-[11px] px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-600 font-medium">已连接</span>
            </div>
            <div class="h-6 px-2 text-[11px] border border-black/10 rounded bg-[#F8F9FA] text-[#61666B] flex items-center">配置</div>
          </div>
          <div class="text-[12px] text-[#61666B]">https://github.com/xiajiajun516/dsh-config.git</div>
        </div>

        <div class="border border-black/10 rounded-lg p-3 bg-white">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center space-x-1.5">
              <span class="text-[12.5px] font-medium text-[#0F1115]">WebDAV</span>
              <span class="text-[11px] px-1.5 py-0.5 rounded bg-gray-100 text-[#81858C]">未配置</span>
            </div>
            <div class="h-6 px-2 text-[11px] border border-black/10 rounded bg-[#F8F9FA] text-[#61666B] flex items-center">配置</div>
          </div>
          <div class="text-[12px] text-[#81858C]">尚未配置 WebDAV 远端同步节点</div>
        </div>

        <div class="border border-black/10 rounded-lg p-3 bg-white">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center space-x-1.5">
              <span class="text-[12.5px] font-medium text-[#0F1115]">S3 对象存储</span>
              <span class="text-[11px] px-1.5 py-0.5 rounded bg-gray-100 text-[#81858C]">未配置</span>
            </div>
            <div class="h-6 px-2 text-[11px] border border-black/10 rounded bg-[#F8F9FA] text-[#61666B] flex items-center">配置</div>
          </div>
        </div>
      </div>

      <!-- 底部 28px 状态栏 -->
      <div class="h-[28px] px-3 border-t border-black/10 flex items-center justify-between bg-white text-[11px] text-[#81858C]">
        <div class="flex items-center space-x-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          <span>就绪 · 远程可达</span>
        </div>
        <span>v0.8.0 · DSH 2.4</span>
      </div>
    </div>

    <!-- ============================================== -->
    <!-- 覆盖层：全屏遮罩 #0000003D (rgba(0,0,0,0.24)) -->
    <!-- ============================================== -->
    <div class="absolute inset-0 bg-black/[0.24] z-10 flex items-center justify-center p-3">
      
      <!-- ============================================== -->
      <!-- D-08 同步通道配置弹窗 (宽 540px，fit-content) -->
      <!-- ============================================== -->
      <div class="w-[540px] bg-white rounded-xl border border-black/10 flex flex-col overflow-hidden text-[#0F1115] z-20">
        
        <!-- 1. 标题区 (48px) -->
        <div class="h-[48px] px-4 border-b border-black/10 flex items-center justify-between bg-white shrink-0">
          <div class="flex items-center space-x-2">
            <span class="text-[13px] font-medium text-[#0F1115]">同步通道</span>
            <!-- 通道徽章 -->
            <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-[#4176E6]/10 text-[#4176E6]">
              Git 私有仓库
            </span>
            <!-- ⓘ 说明图标 -->
            <button type="button" class="text-[#81858C] hover:text-[#0F1115] transition-colors" title="通道说明">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="16" x2="12" y2="12"/>
                <line x1="12" y1="8" x2="12.01" y2="8"/>
              </svg>
            </button>
          </div>
          <!-- 最右 ✕ 关闭图标 -->
          <button type="button" class="text-[#81858C] hover:text-[#0F1115] transition-colors p-1" title="关闭">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <!-- 2. 内容区 (内边距 12px 16px，纵向 10px 间距，无独立动作区) -->
        <div class="px-4 py-3 flex flex-col space-y-2.5 overflow-y-auto">
          
          <!-- 警示 Banner (warn: 橙色 #F59E0B 12% 底 + 三角警告图标) -->
          <div class="bg-[#F59E0B]/[0.12] border border-[#F59E0B]/30 rounded-lg p-2.5 flex items-start space-x-2 text-[12px] leading-[1.5] text-[#0F1115]">
            <svg class="w-3.5 h-3.5 text-[#F59E0B] shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
              <line x1="12" y1="9" x2="12" y2="13"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <div class="flex-1">
              安全要求：同步仓库必须为私有仓库（public 仓库会公开你的配置内容）。认证 token 仅用于仓库访问，绝不写入同步文件、提交内容或日志。
            </div>
          </div>

          <!-- 分组标签「仓库配置」 -->
          <div class="text-[12px] font-medium text-[#0F1115] pt-0.5">
            仓库配置
          </div>

          <!-- 仓库选择器 (两枚 ghost 小按钮同行) -->
          <div class="flex items-center space-x-2">
            <button type="button" class="h-[28px] px-2.5 text-[12px] text-[#0F1115] bg-[#EBEEF2] border border-[#979DA6] rounded-lg font-medium transition-colors hover:bg-[#E2E6EB] flex items-center space-x-1">
              <svg class="w-3.5 h-3.5 text-[#61666B]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
              </svg>
              <span>选择已有私有仓库</span>
            </button>
            <button type="button" class="h-[28px] px-2.5 text-[12px] text-[#61666B] bg-white border border-black/10 rounded-lg transition-colors hover:bg-black/[0.04] flex items-center space-x-1">
              <svg class="w-3.5 h-3.5 text-[#81858C]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              <span>新建私有仓库</span>
            </button>
          </div>

          <!-- 字段「仓库地址」 -->
          <div class="flex flex-col space-y-1">
            <div class="flex items-center space-x-1">
              <label class="text-[12px] text-[#61666B]">仓库地址</label>
              <button type="button" class="text-[#81858C] hover:text-[#0F1115]" title="支持 HTTPS 或 SSH 协议 URL">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <circle cx="12" cy="12" r="10"/>
                  <line x1="12" y1="16" x2="12" y2="12"/>
                  <line x1="12" y1="8" x2="12.01" y2="8"/>
                </svg>
              </button>
            </div>
            <input 
              type="text" 
              value="https://github.com/xiajiajun516/dsh-config.git"
              placeholder="https://github.com/user/private-repo.git" 
              class="h-[30px] w-full px-2.5 text-[12.5px] font-mono text-[#0F1115] bg-white border border-black/10 rounded-lg outline-none focus:border-[#4176E6] transition-colors"
            />
          </div>

          <!-- 字段「仓库内子目录」 -->
          <div class="flex flex-col space-y-1">
            <div class="flex items-center space-x-1">
              <label class="text-[12px] text-[#61666B]">仓库内子目录</label>
              <button type="button" class="text-[#81858C] hover:text-[#0F1115]" title="若为空则直接存储在仓库根目录下">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <circle cx="12" cy="12" r="10"/>
                  <line x1="12" y1="16" x2="12" y2="12"/>
                  <line x1="12" y1="8" x2="12.01" y2="8"/>
                </svg>
              </button>
            </div>
            <input 
              type="text" 
              value="backups/workstation-alpha"
              placeholder="DSH备份（可选）" 
              class="h-[30px] w-full px-2.5 text-[12.5px] font-mono text-[#0F1115] bg-white border border-black/10 rounded-lg outline-none focus:border-[#4176E6] transition-colors"
            />
          </div>

          <!-- 字段「认证 token」 -->
          <div class="flex flex-col space-y-1">
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-1.5">
                <label class="text-[12px] text-[#61666B]">认证 token</label>
                <!-- 绿徽章「凭据已配置」 -->
                <span class="inline-flex items-center px-1.5 py-0.2 rounded text-[11px] font-medium bg-[#22C55E]/10 text-[#22C55E]">
                  凭据已配置
                </span>
                <button type="button" class="text-[#81858C] hover:text-[#0F1115]" title="具备 repo 作用域的个人访问令牌 (PAT)">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="16" x2="12" y2="12"/>
                    <line x1="12" y1="8" x2="12.01" y2="8"/>
                  </svg>
                </button>
              </div>
            </div>
            <!-- 密码框 (密文圆点显示，占位 ghp_…（可选）) -->
            <div class="relative flex items-center">
              <input 
                type="password" 
                value="ghp_920839840294820394820938420938402"
                placeholder="ghp_…（可选）" 
                class="h-[30px] w-full px-2.5 text-[12.5px] font-mono tracking-widest text-[#0F1115] bg-white border border-black/10 rounded-lg outline-none focus:border-[#4176E6] transition-colors"
              />
            </div>
          </div>

          <!-- 底部 actionRow：无 Modal.Footer，直接作为内容区末尾行 (立即保存 + 绿徽章已保存 + ⓘ) -->
          <div class="pt-2 flex items-center justify-between pb-1">
            <div class="flex items-center space-x-2">
              <button type="button" class="h-[30px] px-3.5 bg-[#0F1115] hover:bg-[#43454A] text-white text-[12.5px] font-medium rounded-lg transition-colors flex items-center">
                立即保存
              </button>
              <!-- 绿徽章「已保存」 -->
              <span class="inline-flex items-center space-x-1 px-2 py-0.5 rounded text-[11px] font-medium bg-[#22C55E]/12 text-[#22C55E]">
                <svg class="w-3 h-3 text-[#22C55E]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
                <span>已保存</span>
              </span>
            </div>

            <!-- 右侧 ⓘ 说明 -->
            <button type="button" class="text-[#81858C] hover:text-[#0F1115] p-1" title="保存后将立即进行轻量连通性嗅探">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="16" x2="12" y2="12"/>
                <line x1="12" y1="8" x2="12.01" y2="8"/>
              </svg>
            </button>
          </div>

        </div>

      </div>

    </div>

  </div>

</body>
</html>
