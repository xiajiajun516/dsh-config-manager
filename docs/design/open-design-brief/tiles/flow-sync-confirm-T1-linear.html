<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>sync confirm · T1</title>
<link rel="stylesheet" href="lin.css">
<style>
.vhHint{color:var(--fg-3);font-size:var(--fs-meta)}
.stats{display:flex;gap:var(--sp-4);align-items:center;font-size:var(--fs-meta);color:var(--fg-3);flex-wrap:wrap}
.stats b{font-family:var(--font-mono);color:var(--fg-1);font-weight:400;margin-left:var(--sp-1)}
.bulk{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border:1px solid var(--line-1);border-radius:var(--r-2);background:var(--surface)}
.bulk .hint{margin-left:auto;font-size:var(--fs-meta);color:var(--fg-3)}
.list{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line-1);border-radius:var(--r-3);background:var(--surface);overflow:hidden}
.thead,.drow{display:grid;grid-template-columns:1fr 56px 132px;gap:var(--sp-3);align-items:center;padding:0 var(--sp-5)}
.thead{height:24px;font-size:var(--fs-meta);color:var(--fg-3);border-bottom:1px solid var(--line-1);flex:none}
.drows{flex:1;min-height:0;overflow:hidden}
.drow{height:32px;font-size:var(--fs-table);border-bottom:1px solid var(--line-2)}
.drow.err{color:var(--fg-3)}
.drow .nm{display:flex;align-items:center;gap:var(--sp-3);min-width:0}
.drow .nm b{font-weight:400;font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .kind{justify-self:start}
.seg2{display:inline-flex;border:1px solid var(--line-1);border-radius:var(--r-1);overflow:hidden;justify-self:end}
.seg2 button{height:20px;padding:0 var(--sp-3);font:inherit;font-size:var(--fs-meta);background:transparent;border:0;color:var(--fg-3);cursor:pointer}
.seg2 button.on{background:var(--surface-2);color:var(--fg-1)}
.seg2 button[disabled]{color:rgba(255,255,255,.22);cursor:default}
.footRow{display:flex;align-items:center;gap:var(--sp-3)}
.footRow .hint{font-size:var(--fs-meta);color:var(--fg-3)}
.footRow .right{margin-left:auto;display:flex;gap:var(--sp-3)}
</style></head>
<body>
  <div class="viewHead" data-block="head">
    <span class="vhTitle">同步差异</span><span class="vhHint">2 项待裁决 · 只影响勾选分区</span>
    <span class="vhRight"><button class="btn ghost sm">取消</button></span>
  </div>

  <div class="stats" data-block="stats">
    <span>新增<b>4</b></span><span>覆盖<b>4</b></span><span>冲突<b>2</b></span><span>删除<b>1</b></span><span>无变化<b>3</b></span><span>错误<b style="color:var(--error)">2</b></span>
  </div>

  <div class="bulk" data-block="bulk">
    <button class="btn ghost sm">全部用本地</button>
    <button class="btn ghost sm">全部用远端</button>
    <span class="hint">只覆盖待确认项，2 项错误不会被执行</span>
  </div>

  <div class="list" data-block="diffs">
    <div class="thead"><span>分区</span><span>需要</span><span style="justify-self:end">采用</span></div>
    <div class="drows">
      <div class="drow"><span class="nm"><b>settings</b></span><span class="kind"><span class="badge cur">冲突</span></span><span class="seg2"><button class="">本地</button><button class="on">远端</button></span></div>
      <div class="drow"><span class="nm"><b>providers</b></span><span class="kind"><span class="badge cur">冲突</span></span><span class="seg2"><button class="on">本地</button><button class="">远端</button></span></div>
      <div class="drow"><span class="nm"><b>plugins</b></span><span class="kind"><span class="badge enc">新增</span></span><span class="seg2"><button class="">跳过</button><button class="on">写入</button></span></div>
      <div class="drow"><span class="nm"><b>sessions</b></span><span class="kind"><span class="badge enc">新增</span></span><span class="seg2"><button class="">跳过</button><button class="on">写入</button></span></div>
      <div class="drow"><span class="nm"><b>mcp</b></span><span class="kind"><span class="badge enc">新增</span></span><span class="seg2"><button class="">跳过</button><button class="on">写入</button></span></div>
      <div class="drow"><span class="nm"><b>skills</b></span><span class="kind"><span class="badge enc">新增</span></span><span class="seg2"><button class="">跳过</button><button class="on">写入</button></span></div>
      <div class="drow"><span class="nm"><b>ui</b></span><span class="kind"><span class="badge off">覆盖</span></span><span class="seg2"><button class="on">本地</button><button class="">远端</button></span></div>
      <div class="drow"><span class="nm"><b>self</b></span><span class="kind"><span class="badge off">覆盖</span></span><span class="seg2"><button class="on">本地</button><button class="">远端</button></span></div>
      <div class="drow"><span class="nm"><b>tui</b></span><span class="kind"><span class="badge off">覆盖</span></span><span class="seg2"><button class="">本地</button><button class="on">远端</button></span></div>
      <div class="drow"><span class="nm"><b>themes</b></span><span class="kind"><span class="badge off">覆盖</span></span><span class="seg2"><button class="">本地</button><button class="on">远端</button></span></div>
      <div class="drow"><span class="nm"><b>pluginData</b></span><span class="kind"><span class="badge off">删除</span></span><span class="seg2"><button class="on">保留</button><button class="">删除</button></span></div>
      <div class="drow"><span class="nm"><b>snapshots</b></span><span class="kind"><span class="badge off">无变化</span></span><span class="seg2"><button disabled>不变</button></span></div>
      <div class="drow"><span class="nm"><b>sync</b></span><span class="kind"><span class="badge off">无变化</span></span><span class="seg2"><button disabled>不变</button></span></div>
      <div class="drow"><span class="nm"><b>market</b></span><span class="kind"><span class="badge off">无变化</span></span><span class="seg2"><button disabled>不变</button></span></div>
      <div class="drow err"><span class="nm"><b>credentials</b></span><span class="kind"><span class="badge bad">错误</span></span><span class="seg2"><button disabled>—</button><button disabled>—</button></span></div>
      <div class="drow err"><span class="nm"><b>pluginAssets</b></span><span class="kind"><span class="badge bad">错误</span></span><span class="seg2"><button disabled>—</button><button disabled>—</button></span></div>
    </div>
  </div>

  <div class="footRow" data-block="footer">
    <span class="hint">导入前自动创建快照 · 失败整体回滚</span>
    <span class="right"><button class="btn ghost">取消</button><button class="btn primary">确认导入</button></span>
  </div>
</body></html>
