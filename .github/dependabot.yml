# Dependabot 版本更新 / Version Updates
# DSH Config Manager 使用 GitHub Dependabot 自动维护依赖版本（npm 依赖 + GitHub Actions）。
# Dependabot keeps npm dependencies and GitHub Actions up to date.

version: 2
updates:
  # npm 依赖（package.json / package-lock.json）
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # GitHub Actions（.github/workflows/）
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
