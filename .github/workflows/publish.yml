name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the GitHub Release (assets + notes)
      id-token: write   # required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm to latest
        # npm trusted publishing (OIDC) needs npm >= 11.5.1; runners may ship an older npm.
        run: npm install -g npm@latest

      - name: Install dependencies
        # Some DSH core packages live only in peerDependencies and are not on
        # the public registry; --legacy-peer-deps skips peer resolution.
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package tarball
        # The installable tgz is attached to the GitHub Release as an asset.
        # npm pack --pack-destination fails if the dir does not exist (fresh checkout).
        run: mkdir -p dist && npm pack --pack-destination ./dist

      - name: Publish to npm (trusted publishing / OIDC)
        # No NODE_AUTH_TOKEN: the npm CLI obtains a short-lived registry token
        # via GitHub Actions OIDC. Requires a trusted publisher configured on
        # npmjs.com for this package (see README "Publishing").
        run: npm publish --access public --provenance

      - name: Create GitHub Release (tag-triggered only)
        # Runs only on tag pushes (not manual dispatch): creates a GitHub
        # Release with auto-generated notes and the tgz artifact, then prepends
        # a hand-written highlight section (方式 2: 手动亮点 + 自动变更记录).
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ① 先创建 release（自动生成 commit 变更记录）
          gh release create "$GITHUB_REF_NAME" \
            dist/dsh-config-manager-*.tgz \
            --generate-notes \
            --title "DSH Config Manager $GITHUB_REF_NAME"

          # ② 把自动生成的变更记录存到临时文件
          gh release view "$GITHUB_REF_NAME" --json body -q .body > /tmp/auto-notes.md

          # ③ 手动亮点段（每次发版前更新这里的列表）
          cat > /tmp/release-notes.md <<'EOF'
          ## ✨ 本次更新亮点
          - 导入向导支持取消/重新选择备份文件：选文件后可换选另一个文件，同一文件可重复选择（input 值恒清空 + 竞态守卫）
          - 远程同步支持 GitHub 登录（OAuth device flow）：设置页一键「使用 GitHub 登录」，免手动输入 token；token 写入 DSH credentials，仅宿主持有、永不回传浏览器
          - GitHub Client ID 内置为默认值：所有安装者开箱即用 GitHub 登录（显式配置可覆盖）
          - 快照自动保留策略：最多保留最近 10 个快照，超出自动清理最旧（可测纯函数 + 边界覆盖）
          - P2 双向同步：三方合并引擎（分区级四象限 + JSON 键级 + 文件级精细合并）+ 共同祖先完整快照存储
          - 分级自动应用策略：低风险（settings/ui/providers/prompts）自动应用、中风险（workspaces/plugins/mcp）待审、高风险（s​e​c​r​e​t/冲突/设备专属）永不自动；首次同步强制预览
          - 拉取预览页：自动已应用列表 + 待审变更（用本地/用远端/跳过 + 差异视图）+ 一键回滚到应用前
          - 同步历史视图 + 待审队列持久化（sync-review-queue.json）+ sync-config schemaVersion
          - 新增 Host 端点：/sync/history、/sync/apply、/sync/rollback
          ## 📦 安装
          ```bash
          dsh plugin --profile web add dsh-config-manager@latest
          ```
          ## 🔄 变更记录（自动生成）
          EOF
          echo "" >> /tmp/release-notes.md
          cat /tmp/auto-notes.md >> /tmp/release-notes.md

          # ④ 用拼接后的完整描述更新 release
          gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
