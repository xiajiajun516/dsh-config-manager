name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the GitHub Release (assets + notes)
      id-token: write   # required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm to latest
        # npm trusted publishing (OIDC) needs npm >= 11.5.1; runners may ship an older npm.
        run: npm install -g npm@latest

      - name: Install dependencies
        # Some DSH core packages live only in peerDependencies and are not on
        # the public registry; --legacy-peer-deps skips peer resolution.
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package tarball
        # The installable tgz is attached to the GitHub Release as an asset.
        # npm pack --pack-destination fails if the dir does not exist (fresh checkout).
        run: mkdir -p dist && npm pack --pack-destination ./dist

      - name: Publish to npm (trusted publishing / OIDC)
        # No NODE_AUTH_TOKEN: the npm CLI obtains a short-lived registry token
        # via GitHub Actions OIDC. Requires a trusted publisher configured on
        # npmjs.com for this package (see README "Publishing").
        run: npm publish --access public --provenance

      - name: Create GitHub Release (tag-triggered only)
        # Runs only on tag pushes (not manual dispatch): creates a GitHub
        # Release with auto-generated notes and the tgz artifact, then prepends
        # a hand-written highlight section (方式 2: 手动亮点 + 自动变更记录).
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ① 先创建 release（自动生成 commit 变更记录）
          gh release create "$GITHUB_REF_NAME" \
            dist/dsh-config-manager-*.tgz \
            --generate-notes \
            --title "DSH Config Manager $GITHUB_REF_NAME"

          # ② 把自动生成的变更记录存到临时文件
          gh release view "$GITHUB_REF_NAME" --json body -q .body > /tmp/auto-notes.md

          # ③ 手动亮点段（每次发版前更新这里的列表）
          cat > /tmp/release-notes.md <<'EOF'
          ## ✨ 本次更新亮点
          - 🛒 新增「配置市场」(Marketplace)：从公开 Git 仓库单向浏览 + 安全下载配置条目——分层信任（目录 manifest 校验 → config.zip 走现有安全导入管道），任何网络来源条目默认不可信，导入前逐条展示来源/校验和并要求确认
          - 🔁 远程同步新增 **WebDAV 通道**：与既有 Git 私库并列双通道；WebDAV 密码经 DSH credentials 槽位读取，绝不落盘、绝不落日志；切换通道从新远端空基线重新开始
          - 🚑 新增 `reinstall` 一键救援命令：跨平台重装 @deepseek-ai/dsh launcher；危险清理项默认不选、需二次 `YES` 确认、wipe 前自动 `.reinstall-backup` 应急备份，DSH 无法启动时也能从 CLI 拉回配置
          - 📦 新增 `agent-instructions` 配置区块（并纳入风险分级）
          ## 📦 安装
          ```bash
          dsh plugin --profile web add dsh-config-manager@latest
          ```
          ## 🔄 变更记录（自动生成）
          EOF
          echo "" >> /tmp/release-notes.md
          cat /tmp/auto-notes.md >> /tmp/release-notes.md

          # ④ 用拼接后的完整描述更新 release
          gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
