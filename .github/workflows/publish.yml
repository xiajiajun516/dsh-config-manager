# 发版流水线：tag `v*` push（或 workflow_dispatch）→ 共享校验阶梯 → Tag guard →
# Release notes guard（CHANGELOG 亮点段 + 描述模板 dry-run，必须在 npm publish 之前）→
# npm publish(OIDC) → GitHub Release。
#
# 校验阶梯（install / typecheck / typecheck:tests / test / build / bundle 护栏 / 三项守卫 / pack）
# 与 ci.yml 是同一份 composite action `.github/actions/verify/action.yml`（tech-debt #17）：
# 检查集只在一处维护，避免「PR 有门禁、发版没有」的漂移。本文件只留发版专属步骤。
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the GitHub Release (assets + notes)
      id-token: write   # required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm to latest
        # npm trusted publishing (OIDC) needs npm >= 11.5.1; runners may ship an older npm.
        run: npm install -g npm@latest

      # 校验阶梯本体（install → typecheck → typecheck:tests → test → build → bundle 护栏 →
      # AGENTS 预算守卫 → 文档路径守卫 → 文档版本守卫 → pack）在共享 composite action 里，
      # 与 ci.yml 是同一份（tech-debt #17）：新增检查只改 .github/actions/verify/action.yml。
      # 顺序提示：Pack 随本 action 提前到 Tag guard 之前；产物 dist/*.tgz 留在工作区，
      # 后面的 "Create GitHub Release" 仍按 dist/dsh-config-manager-*.tgz 取附件。
      - name: Install / verify（共享 composite action）
        uses: ./.github/actions/verify

      - name: Tag guard (形态 + tag↔版本)
        # 为什么必须在 npm publish 之前：npm 上同一版本号不可重发，
        # tag 落后会让 Release 描述与包不符，tag 领先则直接把包发成另一个版本号。
        # 规则与处置见 docs/contributing/versioning.md §11.1/§11.2。
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$'; then
            echo "::error::tag $GITHUB_REF_NAME 形态不合规：只允许 vX.Y.Z 或 vX.Y.Z-(alpha|beta|rc).N"
            exit 1
          fi
          PKG=$(node -p 'require("./package.json").version')
          if [ "v$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json.version $PKG 不一致"
            exit 1
          fi

      # Package tarball 已在共享 action 里跑过（同一命令），dist/*.tgz 由下面的 GitHub Release
      # 步骤作为附件带走；此处不再重复打包（tech-debt #17：同一检查只留一处定义）。

      - name: "Release notes guard: CHANGELOG 格式/亮点 + 描述模板 (before publish)"
        # 为什么门禁必须放在 npm publish 之前：npm 上同一版本号不可重发，
        # 若把「抽取 + 非空校验」留到后面的 release 步骤（带 tag 条件），
        # CHANGELOG 漏写时只会让流水线变红，包却已经发到 npm；
        # 而 workflow_dispatch 路径没有 tag，release 步骤整段被跳过，
        # 门禁也会跟着被跳过，publish 却照常执行。
        # 因此提前为独立步骤：push tag 与 workflow_dispatch 两条路径都执行，
        # 产物仍写到 /tmp/highlights.md，供后面的 release 步骤原样复用。
        run: |
          # 手动触发没有 tag，改用 package.json 的版本号；
          # extract-release-notes.py 内部会 lstrip("v")，tag 形态与纯版本都接受。
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="v$(node -p 'require("./package.json").version')"
          fi
          python3 .github/scripts/extract-release-notes.py "$VERSION" CHANGELOG.md > /tmp/highlights.md
          if [ ! -s /tmp/highlights.md ]; then
            echo "::error::CHANGELOG.md 缺少当前版本 $VERSION 的亮点段，请先在 CHANGELOG.md 顶部按 ## [vX.Y.Z] 补充（中英双语）后再发版"
            exit 1
          fi

          # CHANGELOG 版本段格式门禁：结构必须与 .github/changelog-template.md 一致 —— 同一个脚本的
          # release 子命令负责开新骨架，所以「文档里写的格式」就是「实际发出去的格式」。
          if ! node .github/scripts/changelog-section.mjs check "$VERSION" --changelog CHANGELOG.md; then
            echo "::error::CHANGELOG.md 的 $VERSION 版本段不符合 .github/changelog-template.md 的结构"
            exit 1
          fi

          # 描述模板 dry-run：release 描述由 .github/release-notes-template.md 渲染。模板写坏必须在这里
          # 就红，而不是等 npm publish 之后创建 Release 时才失败 —— 那会留下「包已发到 npm、描述没写」的半成品。
          # 自动变更记录此刻还不存在（由 gh release create --generate-notes 生成），故用桩文件占位。
          printf '(auto notes placeholder)\n' > /tmp/auto-notes.stub.md
          if ! node .github/scripts/render-release-notes.mjs "$VERSION" .github/release-notes-template.md /tmp/highlights.md /tmp/auto-notes.stub.md > /tmp/release-notes.dryrun.md; then
            echo "::error::release 描述模板渲染失败：检查 .github/release-notes-template.md 与 .github/scripts/render-release-notes.mjs"
            exit 1
          fi

      - name: Publish to npm (trusted publishing / OIDC)
        # No NODE_AUTH_TOKEN: the npm CLI obtains a short-lived registry token
        # via GitHub Actions OIDC. Requires a trusted publisher configured on
        # npmjs.com for this package (see README "Publishing").
        run: npm publish --access public --provenance

      - name: Create GitHub Release (tag-triggered only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ① 先创建 release（自动生成 commit 变更记录，conventional commits 自动分组）
          gh release create "$GITHUB_REF_NAME" \
            dist/dsh-config-manager-*.tgz \
            --generate-notes \
            --title "DSH Config Manager $GITHUB_REF_NAME"

          # ② 把自动生成的变更记录存到临时文件
          gh release view "$GITHUB_REF_NAME" --json body -q .body > /tmp/auto-notes.md

          # ③ 双语亮点段已由前面的 "Release notes guard" 步骤抽取并做过非空校验，写入 /tmp/highlights.md
          #    （push tag 与 workflow_dispatch 两条路径都会执行）；同一门禁还用它 + 桩自动记录做了一次
          #    模板 dry-run，所以这里的渲染不会再因为模板问题失败。故此处不再重复抽取。

          # ④ 拼装完整描述：模板渲染（模板与渲染器都在仓库里，改文案不用动 workflow）
          node .github/scripts/render-release-notes.mjs \
            "$GITHUB_REF_NAME" \
            .github/release-notes-template.md \
            /tmp/highlights.md \
            /tmp/auto-notes.md > /tmp/release-notes.md

          # ⑤ 用拼接后的完整描述更新 release
          gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
