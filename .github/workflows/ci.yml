# PR / 主干校验门禁 / PR & main-branch validation gate
#
# 与 publish.yml 的分工（两条流水线互不重叠）：
#  - publish.yml：tag `v*` push → typecheck → test → build → pack → 发布到 registry(OIDC) → GitHub Release
#  - ci.yml（本文件）：pull_request → main 与 push → main 的同一套校验，**零发布副作用**
#    （不含任何推送 registry 的步骤，不申请 OIDC 发布凭据，不请求仓库写权限）。
#
# 安装契约与步骤顺序均与 publish.yml 一致（Node 24 + registry-url + `npm ci --legacy-peer-deps`）：
# 部分 @deepseek-ai/* 只声明在 peerDependencies 且未发布到公共 registry，
# 不带 `--legacy-peer-deps` 的普通 `npm ci` 会因无法解析 peer 而红灯。
#
# 单 job × 平台矩阵跑完整阶梯（install → typecheck → typecheck:tests → test → build → bundle guard → pack）。
# 阶梯本体在共享 composite action `.github/actions/verify/action.yml`（与 publish.yml 同一份，tech-debt #17）：
# composite action 的 run 步骤必须显式声明 shell，故这些步骤三平台统一 shell: bash（与 pack 步骤原有的选择一致）。
# 实测全量测试约 90 秒（ubuntu），三平台并行；拆成多个 job 只会重复 checkout/setup-node，
# 并增加「哪个 job 才是 required」的出错面。耗时由 concurrency + timeout 控制。
# 平台矩阵的理由见 jobs.verify 的 matrix 注释（32 处 process.platform 分支此前只有 ubuntu 覆盖）。
# 全量测试不按目录裁剪（裁剪会漏检）。任何失败一律保持真实红灯，不做「允许失败」、不加自动重试
# （`src/utils/env-lock.test.ts` / `src/client/run-store.test.ts` 存在负载相关的间歇性失败，
#  但多数运行全绿；若 CI 红灯先 `gh run rerun <id> --failed` 确认是否为该间歇，再判定缺陷）。
#
# actions 与 publish.yml 固定到同一批 SHA（供应链口径一致）；升级时两处必须同时改。

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# 最小权限：本流水线只读代码。发布权限（OIDC 发布凭据 / 仓库写权限）只属于 publish.yml。
permissions:
  contents: read

# 同一 ref 上新的提交到达时取消旧运行：既省钱，也避免陈旧运行的结论误判当前提交。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck / Test / Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 平台矩阵（2026-09，承接「CI 只有 ubuntu」的评审结论）：全仓有 32 处非测试 process.platform 分支
    # （env-lock / atomic-write / process-control / plugin-cli / recursive-walk / 档案启动器…）。
    # 此前只跑 ubuntu → Windows 侧只有作者本机跑得到（他人 PR 无从验证），macOS 侧（env-lock 的
    # darwin 分支等）则**零真实执行**。三个平台跑同一套命令，结论才是「这个改动跨平台成立」。
    #
    # fail-fast: false —— 一个平台红了要能同时看到其余平台的结论，而不是把它们取消掉。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          # macOS 观察期：作者只有 Windows，无法在合入前本地验证；先只**收集结论**。
          # 连续 1~2 次绿灯后删掉这一行 `experimental: true` 即变成硬门禁 —— 不做长期「允许失败」。
          - os: macos-latest
            experimental: true
    # 仅 macOS 观察期条目允许失败（其余两个平台恒为硬门禁）；见上面注释的退出条件。
    continue-on-error: ${{ matrix.experimental == true }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # 校验阶梯本体（install → typecheck → typecheck:tests → test → build → bundle 护栏 →
      # AGENTS 预算守卫 → 文档路径守卫 → 文档版本守卫 → pack）在共享 composite action 里，
      # 与 publish.yml 是同一份（tech-debt #17）：新增检查只改 .github/actions/verify/action.yml。
      # Checkout / Setup Node.js 留在本文件：三平台 matrix 与 cache: npm 是调用方语义。
      - name: Install / verify（共享 composite action）
        uses: ./.github/actions/verify
